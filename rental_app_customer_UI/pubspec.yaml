name: autora_rental
description: Autora Car Rental Application

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.2
  
  # HTTP & API
  http: ^1.1.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # State Management
  provider: ^6.1.1
  
  # Date Formatting
  intl: ^0.18.1
  
  # Maps (optional - for branch locations)
  google_maps_flutter: ^2.5.0

  # Image Caching (optional)
  cached_network_image: ^3.3.0

  # URL Launcher (for Phone Calls & Maps)
  url_launcher: ^6.2.2

  # Image Picker (for inspection photos)
  image_picker: ^1.0.4

  # Signature Pad (for customer signatures)
  signature: ^5.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
